# =====================================================================
# GestiMed : personnalisation du thème FlatLaf (charte « bleu-vert médical »).
# Chargé par vue/Theme.installer() via FlatLaf.registerCustomDefaultsSource.
# Les mêmes couleurs sont exposées en Java dans My_application.vue.Theme.
# Syntaxe : https://www.formdev.com/flatlaf/properties-files/
# =====================================================================

# ----- palette -----
@accentColor = #0E7C86
@background = #F5F8FA
@foreground = #1F2D3D
@selectionBackground = #D3ECEE
@selectionForeground = #0A2E33
@selectionInactiveBackground = #E3F2F3
@selectionInactiveForeground = #1F2D3D
@disabledForeground = #9AA8B6

# ----- police : Segoe UI (Windows), sinon police sans empattement du système -----
defaultFont = 13 "Segoe UI", "Noto Sans", "Helvetica Neue", sans-serif

# ----- formes -----
Component.arc = 8
Button.arc = 8
TextComponent.arc = 6
CheckBox.arc = 4
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderColor = #CBD5DD
Component.focusedBorderColor = #0E7C86

# ----- boutons -----
Button.margin = 5,14,5,14
Button.background = #FFFFFF
Button.borderColor = #CBD5DD
Button.hoverBackground = #EEF6F7
Button.pressedBackground = #DCEFF1
Button.default.background = #0E7C86
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = #0B6C75
Button.default.pressedBackground = #0A5C63
Button.default.borderColor = #0E7C86
Button.toolbar.hoverBackground = #E3F2F3
Button.toolbar.pressedBackground = #CDE8EA

# ----- champs de saisie -----
TextField.background = #FFFFFF
FormattedTextField.background = #FFFFFF
PasswordField.background = #FFFFFF
TextArea.background = #FFFFFF
ComboBox.background = #FFFFFF
ComboBox.buttonBackground = #FFFFFF
Spinner.background = #FFFFFF
TextComponent.selectionBackground = #BFE3E6
TextComponent.selectionForeground = #0A2E33

# ----- tableaux -----
Table.rowHeight = 32
Table.background = #FFFFFF
Table.alternateRowColor = #F7FAFB
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.gridColor = #EDF1F4
Table.intercellSpacing = 0,1
Table.cellMargins = 2,8,2,8
TableHeader.background = #FFFFFF
TableHeader.foreground = #3A4B5C
TableHeader.font = bold
TableHeader.height = 36
TableHeader.separatorColor = #EDF1F4
TableHeader.bottomSeparatorColor = #DDE3E8
TableHeader.cellMargins = 2,8,2,8

# ----- listes et arbres -----
List.background = #FFFFFF
Tree.background = #FFFFFF
Tree.rowHeight = 26

# ----- onglets -----
TabbedPane.tabHeight = 36
TabbedPane.selectedBackground = #FFFFFF
TabbedPane.underlineColor = #0E7C86
TabbedPane.inactiveUnderlineColor = #9CCFD3
TabbedPane.hoverColor = #EEF6F7
TabbedPane.focusColor = #E3F2F3
TabbedPane.tabSeparatorsFullHeight = false
TabbedPane.showTabSeparators = false

# ----- menus -----
MenuBar.background = #FFFFFF
MenuBar.borderColor = #DDE3E8
MenuItem.selectionBackground = #E3F2F3
MenuItem.selectionForeground = #0A2E33
Menu.selectionBackground = #E3F2F3
Menu.selectionForeground = #0A2E33
PopupMenu.borderColor = #DDE3E8

# ----- barres de défilement -----
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.thumb = #C3CDD5
ScrollBar.hoverThumbColor = #A9B6C1
ScrollBar.track = #F5F8FA
ScrollBar.showButtons = false
ScrollPane.borderColor = #DDE3E8

# ----- divers -----
TitledBorder.titleColor = #0A5C63
Separator.foreground = #DDE3E8
ToolTip.background = #1F2D3D
ToolTip.foreground = #FFFFFF
ProgressBar.foreground = #0E7C86
OptionPane.messageFont = +1
