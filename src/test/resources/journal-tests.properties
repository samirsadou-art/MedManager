# Journalisation pendant mvn test (voir java.util.logging.config.file dans le pom.xml).
# Les tests simulent volontairement des pannes (base en échec, visionneuse absente...) :
# le journal applicatif « GestiMed » est coupé pour que la console ne montre que les
# vrais problèmes. Les autres journaux restent visibles à partir de WARNING.
handlers=java.util.logging.ConsoleHandler
.level=WARNING
java.util.logging.ConsoleHandler.level=ALL
GestiMed.level=OFF
